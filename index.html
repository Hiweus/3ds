<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sound direction v3</title>
<style>
:root{--bg:#14111a;--panel:#1d1826;--line:#3a2d4d;--ink:#e6dcf0;--mute:#9a8bb0;--arrow:#9b2fc4;--sel:#e0405a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:16px/1.5 "Avenir Next","Segoe UI",system-ui,sans-serif;display:grid;place-items:center;padding:24px}
main{width:min(920px,100%);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;align-items:start}
@media(max-width:720px){main{grid-template-columns:1fr}}
h1{font-size:1.7rem;margin:0 0 6px;letter-spacing:-.01em}
p{margin:0 0 18px;color:var(--mute)}
.group{margin-bottom:18px}
.group>span{display:block;font-size:.9rem;color:var(--mute);margin-bottom:8px}
.file{display:block;border:1.5px dashed var(--line);border-radius:10px;padding:16px;cursor:pointer;background:var(--panel)}
.file:hover,.file.drag{border-color:var(--arrow)}
.file input{position:absolute;opacity:0;width:1px;height:1px}
.file:focus-within{outline:2px solid var(--arrow);outline-offset:2px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;background:var(--panel);color:var(--ink);border:0;border-right:1px solid var(--line);padding:10px 4px;font:inherit;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--arrow);color:#fff}
.sl{display:grid;grid-template-columns:90px 1fr;align-items:center;margin-bottom:6px}
input[type=range]{width:100%;accent-color:var(--arrow)}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.btn{background:var(--arrow);color:#fff;border:0;border-radius:10px;padding:10px 18px;font:inherit;cursor:pointer}
.btn.alt{background:var(--panel);border:1px solid var(--line);color:var(--ink)}
.mini{background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:2px 8px;font:inherit;font-size:.85rem;cursor:pointer}
button:disabled,input:disabled,select:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}
input[type=number],select{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit}
input[type=number]{width:76px}
#steps{margin:8px 0;padding-left:22px}
#steps li{margin-bottom:6px}
#steps li span{margin-right:8px}
.cap{font-size:.85rem;color:var(--mute)}
#status{min-height:1.5em;color:var(--mute);font-size:.9rem;margin-top:14px}
.wheel{text-align:center;position:sticky;top:24px}
svg{width:100%;max-width:380px;height:auto}
.dir{cursor:pointer;outline:none}
.dir .a{fill:var(--arrow);transition:fill .15s}
.dir:hover .a{fill:#b45be0}
.dir[aria-checked=true] .a{fill:var(--sel)}
.dir:focus-visible .a{stroke:#fff;stroke-width:2}
.hit{fill:transparent}
.wheel.off .ring{opacity:.35}
#label{margin-top:4px;font-size:1.1rem}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <section>
    <h1>Sound direction</h1>
    <p>Load a sound, pick where it comes from, and listen with headphones.</p>

    <div class="group">
      <label class="file" id="drop">
        <input type="file" id="file" accept="audio/*">
        <span id="fname">Choose an audio file, or drop one here</span>
      </label>
    </div>

    <div class="group">
      <span>Height</span>
      <div class="seg" id="elev" role="group" aria-label="Height">
        <button data-e="up" aria-pressed="false">Up</button>
        <button data-e="level" aria-pressed="true">Level</button>
        <button data-e="down" aria-pressed="false">Down</button>
        <button data-e="center" aria-pressed="false">Center</button>
      </div>
    </div>

    <div class="group">
      <span>Realism</span>
      <label class="sl">Distance <input type="range" id="dist" min="1" max="6" step="0.1" value="1.5"></label>
      <label class="sl">Rear effect <input type="range" id="rear" min="0" max="100" value="70"></label>
      <div class="row">
        <label><input type="checkbox" id="enh" checked> Enhanced</label>
        <label><input type="checkbox" id="wobble"> Head motion</label>
      </div>
    </div>

    <div class="group">
      <span>Animation: set direction, height and realism, then save it as a step</span>
      <div class="row">
        <label>Seconds to get here <input type="number" id="secs" value="2" min="0.2" max="60" step="0.1" disabled></label>
        <select id="turn" aria-label="Turn direction" disabled>
          <option value="short">Shortest way</option>
          <option value="cw">Clockwise</option>
          <option value="ccw">Counter-clockwise</option>
        </select>
      </div>
      <div class="row">
        <button class="btn alt" id="save">Save as step 1</button>
        <button class="btn alt" id="clear" disabled>Clear steps</button>
      </div>
      <ol id="steps"></ol>
      <div class="cap" id="total"></div>
      <div class="row">
        <label><input type="checkbox" id="anim" disabled> Play animation</label>
        <label><input type="checkbox" id="rep"> Repeat path</label>
        <label><input type="checkbox" id="ease" checked> Smooth start and stop</label>
      </div>
    </div>

    <div class="row">
      <button class="btn" id="play" disabled>Play</button>
      <label><input type="checkbox" id="loop" checked> Loop</label>
      <button class="btn alt" id="dl" disabled>Download WAV</button>
    </div>
    <div id="status" role="status" aria-live="polite"></div>
  </section>

  <section class="wheel" id="wheel">
    <svg viewBox="0 0 320 320" role="radiogroup" aria-label="Direction around your head">
      <g class="ring" id="ring"></g>
      <g id="dotg" style="display:none"><circle cx="160" cy="105" r="6" fill="#fff"/></g>
      <circle cx="160" cy="160" r="30" fill="#221b2e" stroke="#6b4a86" stroke-width="2"/>
      <path d="M152 131 L160 118 L168 131" fill="#221b2e" stroke="#6b4a86" stroke-width="2" stroke-linejoin="round"/>
      <ellipse cx="127" cy="160" rx="4" ry="9" fill="#221b2e" stroke="#6b4a86" stroke-width="2"/>
      <ellipse cx="193" cy="160" rx="4" ry="9" fill="#221b2e" stroke="#6b4a86" stroke-width="2"/>
    </svg>
    <div id="label"></div>
    <div class="cap">Top view of your head, nose pointing up</div>
  </section>
</main>

<script>
const $ = s => document.querySelector(s);
const mod = (a, n) => ((a % n) + n) % n;
const NAMES = ["Front","Front right","Right","Back right","Back","Back left","Left","Front left"];
const ELEV = { up: 50, level: 0, down: -50 };
const ELEV_TXT = { up: ", above", level: "", down: ", below" };
const TURN_TXT = { short: "shortest way", cw: "clockwise", ccw: "counter-clockwise" };
const WOB_DEG = 3.5, WOB_HZ = 0.2, RAD = Math.PI / 180;
let az = 0, elev = "level", ctx, buffer, live = null, raf = 0;
let steps = [];

/* ---------- wheel ---------- */
const ring = $("#ring");
NAMES.forEach((name, i) => {
  const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
  g.setAttribute("class", "dir");
  g.setAttribute("role", "radio");
  g.setAttribute("tabindex", "0");
  g.setAttribute("aria-label", name);
  g.setAttribute("aria-checked", i === 0);
  g.setAttribute("transform", `rotate(${i * 45} 160 160)`);
  g.dataset.i = i;
  g.innerHTML = '<circle class="hit" cx="160" cy="52" r="26"/><path class="a" d="M160 28 L173 52 L165 52 L165 80 L155 80 L155 52 L147 52 Z"/>';
  ring.appendChild(g);
});
ring.addEventListener("click", e => { const g = e.target.closest(".dir"); if (g) setAz(+g.dataset.i * 45); });
ring.addEventListener("keydown", e => {
  const g = e.target.closest(".dir"); if (!g) return;
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); setAz(+g.dataset.i * 45); }
});
function setAz(a) { az = a; refresh(); }
function elevText(el, c) { return c ? "Inside the head" : ""; }
function refresh() {
  ring.querySelectorAll(".dir").forEach(g => g.setAttribute("aria-checked", elev !== "center" && +g.dataset.i * 45 === az));
  $("#wheel").classList.toggle("off", elev === "center");
  if (!(live && live.path && animating())) {
    $("#label").textContent = elev === "center" ? "Inside the head" : NAMES[az / 45] + ELEV_TXT[elev];
  }
  document.querySelectorAll("#elev button").forEach(b => b.setAttribute("aria-pressed", b.dataset.e === elev));
  $("#dist").disabled = $("#rear").disabled = $("#wobble").disabled = !$("#enh").checked;
}
$("#elev").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { elev = b.dataset.e; refresh(); } });
["dist", "rear", "enh"].forEach(id => $("#" + id).addEventListener("input", refresh));

/* ---------- state and sound parameters ---------- */
// A state is one position: azimuth (degrees), elevation (degrees), center (0..1), distance, rear effect (0..100).
function getState() {
  return { az, el: ELEV[elev] || 0, c: elev === "center" ? 1 : 0, dist: +$("#dist").value, rear: +$("#rear").value };
}
function position(a, el) {
  const x = a * RAD, e = el * RAD;
  return [Math.sin(x) * Math.cos(e), Math.sin(e), -Math.cos(x) * Math.cos(e)];
}
// Turns a state into values for every audio parameter. "back" is 0 in front and 1 directly behind.
function frame(s, wobDeg) {
  let k = { shelf: 0, peak: 0, lp: 20000, level: 1, send: 0 };
  if ($("#enh").checked) {
    const d = s.dist, r = s.rear / 100, back = (1 - Math.cos(s.az * RAD)) / 2, front = 1 - back;
    k = {
      shelf: -9 * r * back,
      peak: 3 * r * front,
      lp: Math.min(20000, 16000 / (1 + 0.4 * (d - 1))) * (1 - 0.4 * r * back),
      level: 1 / (1 + 0.5 * (d - 1)),
      send: Math.min(0.5, 0.08 + 0.05 * (d - 1)) * (1 + 0.6 * back)
    };
  }
  const p = position(s.az + wobDeg, s.el);
  return { x: p[0], y: p[1], z: p[2], shelf: k.shelf, peak: k.peak, lp: k.lp, level: k.level,
           send: k.send * (1 - s.c), wet: 1 - s.c, dry: s.c };
}
function makeIR(c) {
  const len = Math.floor(c.sampleRate * 1.4), b = c.createBuffer(2, len, c.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const d = b.getChannelData(ch); let lp = 0;
    for (let i = 0; i < len; i++) {
      lp += 0.45 * ((Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.5) - lp);
      d[i] = lp;
    }
  }
  return b;
}
function build(c, src, live) {
  const p = new PannerNode(c, { panningModel: "HRTF", distanceModel: "inverse", refDistance: 1, rolloffFactor: 0 });
  const shelf = new BiquadFilterNode(c, { type: "highshelf", frequency: 5000 });
  const peak = new BiquadFilterNode(c, { type: "peaking", frequency: 3000, Q: 1 });
  const lp = new BiquadFilterNode(c, { type: "lowpass", frequency: 20000, Q: 0.5 });
  const wet = new GainNode(c), level = new GainNode(c);
  const dry = new GainNode(c, { channelCount: 1, channelCountMode: "explicit" });
  const send = new GainNode(c), rev = new ConvolverNode(c, { buffer: makeIR(c) });
  // Headroom so the HRTF, reverb and dry paths can add up without clipping; live playback also gets a limiter.
  const out = new GainNode(c, { gain: 0.5 });
  if (live) out.connect(new DynamicsCompressorNode(c, { threshold: -3, knee: 0, ratio: 20, attack: 0.003, release: 0.1 })).connect(c.destination);
  else out.connect(c.destination);
  src.connect(p).connect(shelf).connect(peak).connect(lp).connect(wet).connect(level).connect(out);
  p.connect(send).connect(rev).connect(out);
  src.connect(dry).connect(out);
  return { src, p, shelf, peak, lp, wet, level, dry, send };
}
const MAP = [["p","positionX","x"],["p","positionY","y"],["p","positionZ","z"],["shelf","gain","shelf"],
  ["peak","gain","peak"],["lp","frequency","lp"],["level","gain","level"],["send","gain","send"],
  ["wet","gain","wet"],["dry","gain","dry"]];
function apply(n, c, smooth, f) {
  const t = c.currentTime;
  for (const [node, prm, key] of MAP) {
    const p = n[node][prm];
    smooth ? p.setTargetAtTime(f[key], t, 0.03) : (p.value = f[key]);
  }
}

/* ---------- animation steps ---------- */
function animating() { return $("#anim").checked && steps.length >= 2; }
function stepText(s, i) {
  const where = s.c ? "Inside the head" : NAMES[s.az / 45] + (s.el > 0 ? ", above" : s.el < 0 ? ", below" : "");
  const base = where + ", distance " + s.dist.toFixed(1) + ", rear " + s.rear + "%";
  return i === 0 ? base + " (start)" : base + ", " + s.secs + " s, " + TURN_TXT[s.turn];
}
function renderSteps() {
  const ol = $("#steps");
  ol.innerHTML = "";
  steps.forEach((s, i) => {
    const li = document.createElement("li");
    const t = document.createElement("span");
    t.textContent = stepText(s, i);
    li.appendChild(t);
    [["Load", "load"], ["Delete", "del"]].forEach(([txt, act]) => {
      const b = document.createElement("button");
      b.className = "mini"; b.textContent = txt; b.dataset.act = act; b.dataset.i = i;
      li.appendChild(b); li.appendChild(document.createTextNode(" "));
    });
    ol.appendChild(li);
  });
  const total = steps.length >= 2 ? buildPath().total : 0;
  $("#total").textContent = steps.length < 2 ? "Save at least two steps to animate. Step 1 is where the sound starts."
    : "Path length " + total.toFixed(1) + " s";
  $("#save").textContent = "Save as step " + (steps.length + 1);
  $("#secs").disabled = $("#turn").disabled = steps.length === 0;
  $("#clear").disabled = steps.length === 0;
  $("#anim").disabled = steps.length < 2;
  if (steps.length < 2) $("#anim").checked = false;
}
$("#save").addEventListener("click", () => {
  const s = getState();
  steps.push({ ...s, secs: steps.length ? Math.min(60, Math.max(0.2, +$("#secs").value || 2)) : 0, turn: $("#turn").value });
  if (steps.length === 2) $("#anim").checked = true;
  renderSteps();
  setStatus("Saved step " + steps.length + ". Change the settings and save the next step.");
});
$("#clear").addEventListener("click", () => { steps = []; renderSteps(); setStatus("Steps cleared."); });
$("#steps").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const i = +b.dataset.i;
  if (b.dataset.act === "del") { steps.splice(i, 1); if (steps.length) steps[0].secs = 0; renderSteps(); }
  else {
    const s = steps[i];
    az = mod(s.az, 360); elev = s.c ? "center" : s.el > 0 ? "up" : s.el < 0 ? "down" : "level";
    $("#dist").value = s.dist; $("#rear").value = s.rear;
    refresh();
    setStatus("Loaded step " + (i + 1) + ". Saving adds it as a new step at the end.");
  }
});

// Unwraps azimuths so each step turns the way the user chose, and lays the steps on a timeline.
function buildPath() {
  const times = [0], un = [steps[0].az];
  for (let i = 1; i < steps.length; i++) {
    const b = steps[i];
    let d = mod(b.az - steps[i - 1].az, 360);
    if (b.turn === "cw") { if (d === 0) d = 360; }
    else if (b.turn === "ccw") { d = d === 0 ? -360 : d - 360; }
    else if (d > 180) d -= 360;
    un.push(un[i - 1] + d);
    times.push(times[i - 1] + b.secs);
  }
  return { times, un, total: times[times.length - 1] };
}
function stateAt(P, t) {
  const last = steps.length - 1;
  if ($("#rep").checked && P.total > 0) t = t % P.total;
  if (t >= P.total) { const s = steps[last]; return { az: P.un[last], el: s.el, c: s.c, dist: s.dist, rear: s.rear }; }
  let i = 1;
  while (i < last && t >= P.times[i]) i++;
  const a = steps[i - 1], b = steps[i];
  const u0 = Math.max(0, (t - P.times[i - 1]) / b.secs);
  const u = $("#ease").checked ? u0 * u0 * (3 - 2 * u0) : u0;
  const L = (x, y) => x + (y - x) * u;
  return { az: L(P.un[i - 1], P.un[i]), el: L(a.el, b.el), c: L(a.c, b.c), dist: L(a.dist, b.dist), rear: L(a.rear, b.rear) };
}

/* ---------- loading ---------- */
async function load(file) {
  if (!file) return;
  stop();
  setStatus("Loading…");
  try {
    ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
    buffer = await ctx.decodeAudioData(await file.arrayBuffer());
    $("#fname").textContent = file.name + " (" + buffer.duration.toFixed(1) + " s)";
    $("#play").disabled = $("#dl").disabled = false;
    setStatus("Ready. Put on headphones and press Play.");
  } catch (err) {
    buffer = null;
    $("#play").disabled = $("#dl").disabled = true;
    setStatus("This file could not be decoded. Try a WAV, MP3, or M4A file.");
  }
}
$("#file").addEventListener("change", e => load(e.target.files[0]));
const drop = $("#drop");
["dragover", "dragenter"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add("drag"); }));
["dragleave", "drop"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove("drag"); }));
drop.addEventListener("drop", e => load(e.dataTransfer.files[0]));

/* ---------- playback ---------- */
function stop() {
  cancelAnimationFrame(raf);
  $("#dotg").style.display = "none";
  if (live) { const s = live.src; live = null; s.onended = null; try { s.stop(); } catch (e) {} }
  $("#play").textContent = "Play";
  refresh();
}
function wobbleAt(t) {
  return $("#enh").checked && $("#wobble").checked ? WOB_DEG * Math.sin(2 * Math.PI * WOB_HZ * t) : 0;
}
function tick() {
  if (!live) return;
  const t = ctx.currentTime - live.t0;
  let s;
  if (live.path && animating()) {
    s = stateAt(live.path, t);
    $("#dotg").style.display = "";
    $("#dotg").setAttribute("transform", `rotate(${s.az} 160 160)`);
    $("#label").textContent = s.c > 0.5 ? "Inside the head" : "Animating: " + NAMES[Math.round(mod(s.az, 360) / 45) % 8];
  } else {
    s = getState();
    $("#dotg").style.display = "none";
  }
  apply(live, ctx, true, frame(s, wobbleAt(t)));
  raf = requestAnimationFrame(tick);
}
$("#play").addEventListener("click", async () => {
  if (live) return stop();
  await ctx.resume();
  const src = new AudioBufferSourceNode(ctx, { buffer, loop: $("#loop").checked });
  const n = build(ctx, src, true);
  n.path = steps.length >= 2 ? buildPath() : null;
  apply(n, ctx, false, frame(getState(), 0));
  src.onended = () => { if (live && live.src === src) stop(); };
  n.t0 = ctx.currentTime;
  src.start();
  live = n;
  $("#play").textContent = "Stop";
  tick();
});
$("#loop").addEventListener("change", e => { if (live) live.src.loop = e.target.checked; });

/* ---------- export ---------- */
function toWav(buf) {
  const n = buf.length, d = new DataView(new ArrayBuffer(44 + n * 4));
  const w = (o, s) => [...s].forEach((ch, i) => d.setUint8(o + i, ch.charCodeAt(0)));
  w(0, "RIFF"); d.setUint32(4, 36 + n * 4, true); w(8, "WAVEfmt ");
  d.setUint32(16, 16, true); d.setUint16(20, 1, true); d.setUint16(22, 2, true);
  d.setUint32(24, buf.sampleRate, true); d.setUint32(28, buf.sampleRate * 4, true);
  d.setUint16(32, 4, true); d.setUint16(34, 16, true); w(36, "data"); d.setUint32(40, n * 4, true);
  const L = buf.getChannelData(0), R = buf.getChannelData(1);
  let pk = 0; for (let i = 0; i < n; i++) pk = Math.max(pk, Math.abs(L[i]), Math.abs(R[i]));
  const g = pk > 0 ? 0.95 / pk : 1;
  let o = 44;
  for (let i = 0; i < n; i++) {
    d.setInt16(o, Math.max(-1, Math.min(1, L[i] * g)) * 32767, true); o += 2;
    d.setInt16(o, Math.max(-1, Math.min(1, R[i] * g)) * 32767, true); o += 2;
  }
  return new Blob([d], { type: "audio/wav" });
}
$("#dl").addEventListener("click", async () => {
  setStatus("Rendering…");
  $("#dl").disabled = true;
  try {
    const enh = $("#enh").checked, sr = buffer.sampleRate, dur = buffer.duration;
    const anim = animating(), wobOn = enh && $("#wobble").checked, P = anim ? buildPath() : null;
    const oc = new OfflineAudioContext(2, buffer.length + (enh ? Math.floor(sr * 1.5) : 0), sr);
    const src = new AudioBufferSourceNode(oc, { buffer });
    const n = build(oc, src);
    if (anim || wobOn) {
      // Moving sound: write every parameter as a curve sampled 50 times per second.
      const N = Math.max(2, Math.ceil(dur * 50)), frames = [];
      for (let i = 0; i < N; i++) {
        const t = i / 50;
        frames.push(frame(anim ? stateAt(P, t) : getState(), wobbleAt(t)));
      }
      for (const [node, prm, key] of MAP) {
        n[node][prm].setValueCurveAtTime(Float32Array.from(frames, f => f[key]), 0, dur);
      }
    } else {
      apply(n, oc, false, frame(getState(), 0));
    }
    src.start();
    const out = await oc.startRendering();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(toWav(out));
    a.download = anim ? "directional-animated.wav"
      : "directional-" + (elev === "center" ? "center" : NAMES[az / 45].toLowerCase().replace(" ", "-") + (elev === "level" ? "" : "-" + elev)) + ".wav";
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    setStatus("Saved " + a.download + (anim && P.total > dur + 0.05 && !$("#rep").checked ? ". The path is longer than the sound, so the last steps were cut off." : ""));
  } catch (err) {
    setStatus("Rendering failed. Try a shorter file.");
  }
  $("#dl").disabled = false;
});

function setStatus(t) { $("#status").textContent = t; }
refresh();
renderSteps();
</script>
</body>
</html>
